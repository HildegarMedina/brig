[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brig"
version = "0.1.0"
description = "Profile-based, isolated development environments"
requires-python = ">=3.12"
dependencies = [
    "packaging>=24,<27",
    "pyyaml>=6,<7",
    "semantic-version>=2.10,<3",
]

[project.scripts]
brig = "brig.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "coverage>=7.16,<8",
    "mitmproxy==12.2.3",
    "pre-commit>=4.6,<5",
    "ruff>=0.17,<0.18",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]

[tool.coverage.run]
source = ["src/brig"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.setuptools.package-data]
"brig.i18n" = ["catalogs/*.json"]
