[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brig"
version = "0.1.0"
description = "A terminal prototype for isolated development environments"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
brig = "brig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
