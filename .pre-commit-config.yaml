repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and automatic fixes
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff automatic formatting
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: unit-tests-coverage
        name: Unit tests with mandatory 100% coverage
        entry: uv run --locked python scripts/check_coverage.py
        language: system
        pass_filenames: false
        always_run: true
